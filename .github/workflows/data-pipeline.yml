name: Data Pipeline Refresh

on:
  schedule:
    # Rotate through the 6 tickers Monday-Saturday at 00:00 UTC:
    # Mon: NVDA | Tue: AAPL | Wed: MSFT | Thu: GOOGL | Fri: AMZN | Sat: TSLA
    - cron: '0 0 * * 1-6'
  workflow_dispatch:
    inputs:
      symbol:
        description: "Ticker to update ('AUTO' for weekday rotation, 'ALL', or e.g. 'NVDA', 'AAPL')"
        required: false
        default: 'AUTO'

jobs:
  fetch-and-amend-data:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Amend stock and news datasets in data/sample
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python scripts/update_sample_data.py --symbol "${{ github.event.inputs.symbol || 'AUTO' }}"

      - name: Commit and push updated sample datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sample/*.csv
          if git diff --staged --quiet; then
            echo "No new rows to commit."
          else
            git commit -m "chore(data): amend sample stock and news datasets [skip ci]"
            git push
          fi
